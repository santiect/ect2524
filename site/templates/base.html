<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ course.codigo }} — {{ course.nome }}{% endblock %}</title>
<link rel="stylesheet" href="{{ base_path|default('') }}static/css/style.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="{{ base_path|default('') }}index.html">
    <span class="brand-code">{{ course.codigo }}</span>
    <span class="brand-name">{{ course.nome }}</span>
  </a>
  <div class="header-meta">{{ course.professor }}</div>
</header>

<main>
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <span>{{ course.instituicao }}</span>
  <a href="https://github.com/{{ course.repo }}" target="_blank" rel="noopener">github.com/{{ course.repo }}</a>
</footer>
</body>
</html>
