titulo: "Aula 2 — O Problema da Dieta"
data: "2026-08-28"  # TODO: ajustar para a data real da aula
resumo: >
  Estudo de caso: o desafio de montar, para uma nutricionista, o cardápio
  de menor custo que atende exigências nutricionais mínimas e máximas.
  Formulação do Problema da Dieta e sua semelhança com o Problema da
  Mochila visto na Aula 1. Duas tarefas: a dieta de um único dia e, em
  seguida, a mesma dieta considerando estoque de alimentos e um horizonte
  de planejamento de 5 dias (uma semana útil).

slides: "slides/aula02.tex"

